<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>計數器</title>
<style>
:root{--bg1:#dbe7ff;--bg2:#f3dcff;--blob1:#7aa7ff;--blob2:#ff9ec7;--blob3:#7fe3c4;--ink:#14213d;--mute:rgba(20,33,61,.62);--glass-hi:rgba(255,255,255,.75);--glass-edge:rgba(255,255,255,.65);--shadow:rgba(40,60,120,.22);--sheet:rgba(255,255,255,.55);--danger:#d6336c;--tint-a:.42;--tint-b:.14;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1020;--bg2:#1a1030;--blob1:#2f5bff;--blob2:#b4338a;--blob3:#12a58a;--ink:#f2f6ff;--mute:rgba(242,246,255,.65);--glass-hi:rgba(255,255,255,.28);--glass-edge:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.45);--sheet:rgba(30,36,60,.55);--danger:#ff7aa8;--tint-a:.38;--tint-b:.10;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0b1020;--bg2:#1a1030;--blob1:#2f5bff;--blob2:#b4338a;--blob3:#12a58a;--ink:#f2f6ff;--mute:rgba(242,246,255,.65);--glass-hi:rgba(255,255,255,.28);--glass-edge:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.45);--sheet:rgba(30,36,60,.55);--danger:#ff7aa8;--tint-a:.38;--tint-b:.10;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;position:relative;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.85;pointer-events:none;z-index:0}
.b1{width:320px;height:320px;background:var(--blob1);top:-60px;left:-80px}
.b2{width:300px;height:300px;background:var(--blob2);top:35%;right:-100px}
.b3{width:340px;height:340px;background:var(--blob3);bottom:-120px;left:10%}
header,main,.hint{position:relative;z-index:1;max-width:760px;margin:0 auto}
header{padding:22px 20px 6px}
h1{font-size:30px;margin:0;font-weight:700;letter-spacing:.5px}
main{padding:12px 16px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.tile{--h:210;position:relative;aspect-ratio:1;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden;
  background:linear-gradient(145deg,hsla(var(--h),95%,68%,var(--tint-a)),hsla(var(--h),90%,60%,var(--tint-b)));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1.5px 0 var(--glass-hi),inset 0 -10px 22px hsla(var(--h),90%,70%,.12),0 12px 30px var(--shadow);
  transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s}
.tile::before{content:"";position:absolute;left:8%;right:8%;top:3px;height:42%;border-radius:24px 24px 60% 60%/24px 24px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.tile.press{transform:scale(.94)}
.tile:focus-visible{outline:3px solid hsla(var(--h),90%,60%,.9);outline-offset:3px}
.name{position:relative;font-size:15px;font-weight:500;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{position:relative;font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.count.bump{animation:bump .22s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.tile.add{font-size:52px;font-weight:300;color:var(--mute);background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.08))}
.hint{padding:6px 20px 28px;font-size:13px;color:var(--mute);text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,15,35,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.sheet{width:100%;max-width:340px;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1.5px 0 var(--glass-hi),0 20px 50px var(--shadow)}
.sheet h2{margin:0;font-size:19px}
.sheet label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:6px}
.sheet input{font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--glass-edge);background:rgba(255,255,255,.35);color:var(--ink);outline:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet input{background:rgba(255,255,255,.1)}}
:root[data-theme="dark"] .sheet input{background:rgba(255,255,255,.1)}
.sheet input:focus-visible{border-color:var(--ink)}
.sheet textarea{font:inherit;font-size:13px;height:130px;resize:none;padding:10px 12px;border-radius:14px;border:1px solid var(--glass-edge);background:rgba(255,255,255,.35);color:var(--ink);outline:none;word-break:break-all}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet textarea{background:rgba(255,255,255,.1)}}
:root[data-theme="dark"] .sheet textarea{background:rgba(255,255,255,.1)}
.bkmsg{font-size:13px;color:var(--mute);margin:0;min-height:1.3em}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.btn{border:1px solid var(--glass-edge);border-radius:999px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer;background:rgba(255,255,255,.3);color:var(--ink)}
.btn.primary{background:linear-gradient(145deg,#5aa0ff,#4a6dff);color:#fff;border-color:rgba(255,255,255,.5)}
.btn.danger{color:var(--danger);margin-right:auto}
.btn:focus-visible{outline:3px solid #5aa0ff;outline-offset:2px}
[hidden]{display:none!important}
body{padding-bottom:96px}
.tabwrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:10;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1.5px 0 var(--glass-hi),0 12px 30px var(--shadow)}
.tab{border:0;background:transparent;color:var(--mute);font:inherit;font-size:15px;font-weight:600;padding:10px 28px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--glass-hi);color:var(--ink)}
.tab:focus-visible{outline:3px solid #5aa0ff;outline-offset:2px}
.day{border-radius:26px;padding:16px;margin-bottom:14px;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.1));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1.5px 0 var(--glass-hi),0 12px 30px var(--shadow)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.dtitle{font-weight:700;font-size:16px}
.dtotal{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{--h:210;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:hsla(var(--h),90%,65%,.35);border:1px solid var(--glass-edge)}
.entry{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--glass-edge);font-size:15px}
.etime{font-variant-numeric:tabular-nums;color:var(--mute);width:46px;flex:none}
.dot{--h:210;width:10px;height:10px;border-radius:50%;flex:none;background:hsl(var(--h),90%,62%)}
.ename{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edel{border:0;background:transparent;color:var(--mute);font-size:18px;line-height:1;cursor:pointer;padding:4px 9px;border-radius:8px}
.edel:focus-visible{outline:2px solid #5aa0ff}
.empty{text-align:center;color:var(--mute);padding:70px 20px;font-size:15px;line-height:1.7}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sbtn{flex:none;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;color:var(--ink);cursor:pointer;background:linear-gradient(145deg,rgba(255,255,255,.4),rgba(255,255,255,.12));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1.5px 0 var(--glass-hi),0 8px 22px var(--shadow);transition:transform .15s}
.sbtn:active{transform:scale(.95)}
.sbtn:focus-visible{outline:3px solid #5aa0ff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.tile,.count.bump{transition:none;animation:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<header><h1 id="pageTitle">計數器</h1><button class="sbtn" id="sleepToggle"></button></header>
<div id="viewCount">
<main><div class="grid" id="grid"></div></main>
<div class="hint" id="sleepInfo"></div>
<div class="hint">按一下 +1，長按格子可編輯。數字係今日次數，00:00 自動清零</div>
<div class="hint"><button class="btn" id="bkBtn">備份 / 還原</button></div>
</div>
<div id="viewLog" hidden><main id="logList"></main></div>
<div class="tabwrap"><nav class="tabbar" role="tablist">
<button class="tab" role="tab" data-tab="count" aria-selected="true">計數</button>
<button class="tab" role="tab" data-tab="log" aria-selected="false">記錄</button>
</nav></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h2 id="mTitle">新增一格</h2>
    <label>名稱<input id="mName" maxlength="20" placeholder="例如：喝水" autocomplete="off"></label>
    <label id="mCountWrap">今日數目<input id="mCount" type="number" inputmode="numeric" step="1"></label>
    <div class="row">
      <button class="btn danger" id="mDel">刪除</button>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">儲存</button>
    </div>
  </div>
</div>

<div class="modal" id="bkModal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h2>備份與還原</h2>
    <p class="bkmsg" id="bkMsg"></p>
    <textarea id="bkText" spellcheck="false" aria-label="備份資料"></textarea>
    <div class="row">
      <button class="btn" id="bkClose">關閉</button>
      <button class="btn" id="bkCopy">複製</button>
      <button class="btn primary" id="bkRestore">還原</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY="counter-items-v1",HUES=[210,265,330,20,150,45,185,295];
  var items=[];
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(Array.isArray(p))items=p;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
  var LKEY="counter-logs-v1",logs=[];
  try{var lr=localStorage.getItem(LKEY);if(lr){var lp=JSON.parse(lr);if(Array.isArray(lp))logs=lp;}}catch(e){}
  function saveLogs(){try{localStorage.setItem(LKEY,JSON.stringify(logs));}catch(e){}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function todayCount(id){var k=dkey(new Date()),n=0;for(var i=0;i<logs.length;i++)if(logs[i].id===id&&dkey(new Date(logs[i].t))===k)n++;return n;}
  function setToday(it,v){
    var cur=todayCount(it.id);
    if(v>cur){for(var i=0;i<v-cur;i++)logs.push({t:Date.now()+i,id:it.id,name:it.name});}
    else if(v<cur){
      var k=dkey(new Date()),idx=[];
      logs.forEach(function(l,j){if(l.id===it.id&&dkey(new Date(l.t))===k)idx.push(j);});
      idx.sort(function(a,b){return logs[b].t-logs[a].t;});
      var rm=idx.slice(0,cur-v);
      logs=logs.filter(function(l,j){return rm.indexOf(j)<0;});
    }
    saveLogs();
  }
  var needSave=false;items.forEach(function(it){if(!it.id){it.id=uid();needSave=true;}});if(needSave)save();

  var grid=document.getElementById("grid");
  var modal=document.getElementById("modal"),mName=document.getElementById("mName"),mCount=document.getElementById("mCount");
  var mTitle=document.getElementById("mTitle"),mDel=document.getElementById("mDel"),mCountWrap=document.getElementById("mCountWrap");
  var current=null;

  function render(){
    grid.innerHTML="";
    items.forEach(function(it,i){
      var b=document.createElement("button");
      b.className="tile";
      b.style.setProperty("--h",it.hue!=null?it.hue:HUES[i%HUES.length]);
      var n=document.createElement("div");n.className="name";n.textContent=it.name;
      var c=document.createElement("div");c.className="count";c.textContent=todayCount(it.id);
      b.appendChild(n);b.appendChild(c);
      var timer=null,long=false,sx=0,sy=0;
      function clear(){clearTimeout(timer);b.classList.remove("press");}
      b.addEventListener("pointerdown",function(e){
        long=false;sx=e.clientX;sy=e.clientY;b.classList.add("press");
        timer=setTimeout(function(){
          long=true;b.classList.remove("press");
          try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}
          openModal(it);
        },500);
      });
      b.addEventListener("pointermove",function(e){
        if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)clear();
      });
      ["pointerup","pointerleave","pointercancel"].forEach(function(t){b.addEventListener(t,clear);});
      b.addEventListener("contextmenu",function(e){e.preventDefault();});
      b.addEventListener("click",function(){
        if(long){long=false;return;}
        logs.push({t:Date.now(),id:it.id,name:it.name});saveLogs();
        c.textContent=todayCount(it.id);
        c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
        save();
      });
      grid.appendChild(b);
    });
    var a=document.createElement("button");
    a.className="tile add";a.textContent="+";a.setAttribute("aria-label","新增一格");
    a.addEventListener("click",function(){openModal(null);});
    grid.appendChild(a);
  }

  function openModal(it){
    current=it;
    mTitle.textContent=it?"編輯格子":"新增一格";
    mName.value=it?it.name:"";
    mCount.value=it?todayCount(it.id):0;
    mDel.style.display=it?"":"none";
    mCountWrap.style.display=it?"":"none";
    modal.classList.add("open");
    setTimeout(function(){mName.focus();},30);
  }
  function closeModal(){modal.classList.remove("open");current=null;}

  function commit(){
    var name=mName.value.trim()||"未命名";
    if(current){
      current.name=name;
      var v=parseInt(mCount.value,10);if(!isNaN(v)&&v>=0)setToday(current,v);
    }else{
      items.push({id:uid(),name:name,count:0,hue:HUES[items.length%HUES.length]});
    }
    save();closeModal();render();
  }

  document.getElementById("mSave").addEventListener("click",commit);
  document.getElementById("mCancel").addEventListener("click",closeModal);
  mDel.addEventListener("click",function(){
    if(!current)return;
    if(!confirm("確定刪除「"+current.name+"」？"))return;
    items=items.filter(function(x){return x!==current;});
    save();closeModal();render();
  });
  modal.addEventListener("click",function(e){if(e.target===modal)closeModal();});
  document.addEventListener("keydown",function(e){
    if(!modal.classList.contains("open"))return;
    if(e.key==="Enter")commit();
    if(e.key==="Escape")closeModal();
  });
  var logList=document.getElementById("logList"),pageTitle=document.getElementById("pageTitle");
  function p2(n){return n<10?"0"+n:""+n;}
  function dkey(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
  function dlabel(d){
    var k=dkey(d),base=(d.getMonth()+1)+"月"+d.getDate()+"日 星期"+"日一二三四五六".charAt(d.getDay());
    if(k===dkey(new Date()))return "今日（"+base+"）";
    if(k===dkey(new Date(Date.now()-864e5)))return "昨日（"+base+"）";
    return base;
  }
  function itemOf(id){for(var i=0;i<items.length;i++)if(items[i].id===id)return {it:items[i],i:i};return null;}
  function hueOf(id){if(id==="sys-sleep")return 255;if(id==="sys-wake")return 40;var f=itemOf(id);if(!f)return 215;return f.it.hue!=null?f.it.hue:HUES[f.i%HUES.length];}
  function nameOf(l){if(l.id==="sys-sleep")return "上床睡覺";if(l.id==="sys-wake")return "起身落床";var f=itemOf(l.id);return f?f.it.name:l.name;}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function renderLog(){
    logList.innerHTML="";
    if(!logs.length){logList.appendChild(el("div","empty","未有記錄\n返去「計數」按格子，就會記低時間同次數。"));logList.firstChild.style.whiteSpace="pre-line";return;}
    var days={},order=[];
    logs.slice().sort(function(a,b){return b.t-a.t;}).forEach(function(l){
      var k=dkey(new Date(l.t));if(!days[k]){days[k]=[];order.push(k);}days[k].push(l);
    });
    order.forEach(function(k){
      var arr=days[k],card=el("section","day"),head=el("div","dayhead");
      head.appendChild(el("span","dtitle",dlabel(new Date(arr[0].t))));
      head.appendChild(el("span","dtotal","共 "+arr.length+" 次"));
      card.appendChild(head);
      var sums={},sorder=[];
      arr.forEach(function(l){var key=l.id||l.name;if(!sums[key]){sums[key]={l:l,n:0};sorder.push(key);}sums[key].n++;});
      var chips=el("div","chips");
      sorder.forEach(function(key){var s=sums[key],c=el("span","chip",nameOf(s.l)+" × "+s.n);c.style.setProperty("--h",hueOf(s.l.id));chips.appendChild(c);});
      card.appendChild(chips);
      arr.forEach(function(l){
        var d=new Date(l.t),row=el("div","entry");
        row.appendChild(el("span","etime",p2(d.getHours())+":"+p2(d.getMinutes())));
        var dot=el("span","dot");dot.style.setProperty("--h",hueOf(l.id));row.appendChild(dot);
        row.appendChild(el("span","ename",nameOf(l)));
        var x=el("button","edel","×");x.setAttribute("aria-label","刪除這筆記錄");
        x.addEventListener("click",function(){
          if(!confirm("刪除這筆記錄？"))return;
          logs=logs.filter(function(z){return z!==l;});
          
          saveLogs();renderLog();render();sleepInfo();
        });
        row.appendChild(x);card.appendChild(row);
      });
      logList.appendChild(card);
    });
  }
  var bk=document.getElementById("bkModal"),bkText=document.getElementById("bkText"),bkMsg=document.getElementById("bkMsg");
  document.getElementById("bkBtn").addEventListener("click",function(){
    bkText.value=JSON.stringify({v:1,items:items,logs:logs});
    bkMsg.textContent="複製下面嘅文字，去另一部裝置貼入來，再按「還原」。";
    bk.classList.add("open");
  });
  document.getElementById("bkClose").addEventListener("click",function(){bk.classList.remove("open");});
  bk.addEventListener("click",function(e){if(e.target===bk)bk.classList.remove("open");});
  document.getElementById("bkCopy").addEventListener("click",function(){
    bkText.focus();bkText.select();
    var ok=false;try{ok=document.execCommand("copy");}catch(e){}
    bkMsg.textContent=ok?"已複製。":"請手動全選並複製。";
  });
  document.getElementById("bkRestore").addEventListener("click",function(){
    var d;try{d=JSON.parse(bkText.value);}catch(e){}
    if(!d||!Array.isArray(d.items)||!Array.isArray(d.logs)){bkMsg.textContent="資料格式唔啱，請貼上完整嘅備份文字。";return;}
    if(!confirm("還原會覆蓋呢部裝置而家嘅所有資料，確定？"))return;
    items=d.items;logs=d.logs;
    items.forEach(function(it){if(!it.id)it.id=uid();});
    save();saveLogs();render();renderLog();sleepInfo();bk.classList.remove("open");
  });
  var tabs=document.querySelectorAll(".tab");
  tabs.forEach(function(t){t.addEventListener("click",function(){
    var isLog=t.getAttribute("data-tab")==="log";
    tabs.forEach(function(o){o.setAttribute("aria-selected",o===t);});
    document.getElementById("viewCount").hidden=isLog;
    document.getElementById("viewLog").hidden=!isLog;
    pageTitle.textContent=isLog?"記錄":"計數器";
    if(isLog)renderLog();window.scrollTo(0,0);
  });});
  function lastOf(id){var b=null;logs.forEach(function(l){if(l.id===id&&(!b||l.t>b.t))b=l;});return b;}
  function hm(t){var d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes());}
  function sleepInfo(){
    var s=lastOf("sys-sleep"),w=lastOf("sys-wake"),txt="";
    if(s&&(!w||s.t>w.t))txt="睡覺中，由 "+hm(s.t)+" 開始";
    else if(s&&w){var m=Math.round((w.t-s.t)/60000);txt="睡咗 "+Math.floor(m/60)+" 小時 "+(m%60)+" 分（"+hm(s.t)+" → "+hm(w.t)+"）";}
    else if(w)txt="最近起身："+hm(w.t);
    document.getElementById("sleepInfo").textContent=txt;
    tgl.textContent=isSleeping()?"☀️ 起身":"🌙 睡覺";
  }
  function sysLog(id,name){logs.push({t:Date.now(),id:id,name:name});saveLogs();sleepInfo();}
  var tgl=document.getElementById("sleepToggle");
  function isSleeping(){var s=lastOf("sys-sleep"),w=lastOf("sys-wake");return !!(s&&(!w||s.t>w.t));}
  tgl.addEventListener("click",function(){if(isSleeping())sysLog("sys-wake","起身落床");else sysLog("sys-sleep","上床睡覺");});
  sleepInfo();
  function msToMidnight(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()+1).getTime()-n.getTime()+500;}
  function schedule(){setTimeout(function(){render();schedule();},msToMidnight());}
  schedule();
  document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});
  render();
})();
</script>
</body>
</html>
